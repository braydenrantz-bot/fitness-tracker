<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RepRank</title>
  <meta name="description" content="Workout tracker with daily rotating workouts, PR tracking and muscle ranks.">
  <meta name="theme-color" content="#0d0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RepRank">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view"></main>

  <div id="restbar" class="restbar" hidden>
    <div class="rest-fill" id="rest-fill"></div>
    <span>Rest</span><b id="rest-time">0:00</b>
    <button id="rest-add">+15s</button>
    <button id="rest-skip">Skip</button>
  </div>

  <nav id="tabbar" class="tabbar" hidden></nav>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
